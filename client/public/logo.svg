<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <defs>
    <linearGradient id="jmSaffronLogo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00" />
      <stop offset="100%" stop-color="#FFA84A" />
    </linearGradient>
    <linearGradient id="jmBlueLogo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="jmTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="jmAIGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <filter id="logoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#4F46E5" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Left Icon Mark (64x64) -->
  <g transform="translate(8, 8)">
    <rect x="0" y="0" width="64" height="64" rx="18" fill="#0C1024" stroke="url(#jmBlueLogo)" stroke-width="2" filter="url(#logoShadow)" />
    <circle cx="32" cy="32" r="22" stroke="white" stroke-opacity="0.05" stroke-width="1" stroke-dasharray="2 3" />
    
    <!-- Left Hand / J -->
    <path d="M 17 24 C 17 18, 26 16, 31 22 L 27 27 C 24 24, 21 25, 21 29 L 21 37 C 21 43, 27 44, 31 40 L 34 45 C 27 50, 17 47, 17 38 Z" fill="url(#jmSaffronLogo)" />
    
    <!-- Right Hand / M -->
    <path d="M 47 40 C 47 46, 38 48, 33 42 L 37 37 C 40 40, 43 39, 43 35 L 43 27 C 43 21, 37 20, 33 24 L 30 19 C 37 14, 47 17, 47 26 Z" fill="url(#jmBlueLogo)" />
    
    <!-- Core Bridge Node -->
    <path d="M 25 31 L 39 33" stroke="#10B981" stroke-width="3" stroke-linecap="round" />
    <circle cx="32" cy="32" r="4" fill="#38BDF8" />
    <circle cx="32" cy="32" r="1.5" fill="#FFFFFF" />
  </g>

  <!-- Typography -->
  <g transform="translate(86, 20)">
    <text x="0" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" letter-spacing="-0.02em" fill="url(#jmTextGrad)">JANSUNWAI</text>
    <text x="142" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" letter-spacing="0.04em" fill="url(#jmAIGrad)"> AI</text>
    <text x="1" y="41" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="800" letter-spacing="0.22em" fill="#94A3B8">AI SMART GOVERNANCE</text>
  </g>
</svg>